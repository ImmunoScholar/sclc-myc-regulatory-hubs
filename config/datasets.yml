# =============================================================================
# Dataset registry — the curated source of truth for M4 acquisition.
#
# This file holds facts a human verified. The machine-readable manifest
# (data/metadata/dataset_manifest.csv) is GENERATED from this plus live GEO
# filelists by scripts/01_data/01_build_manifest.R — file names, byte sizes and
# URLs are never hand-typed, because transcription errors in a manifest are
# indistinguishable from corruption.
#
# ALL FIELDS BELOW WERE VERIFIED AGAINST GEO/UCSC/cBioPortal ON 2026-07-26.
# Genome builds come from each series' own !Sample_data_processing "Assembly"
# declaration, not from file names.
#
# CRITICAL: the project build is hg19 (frozen, D-004). Four coordinate-level
# series are hg38 and REQUIRE an explicit, QC'd liftOver. See D-014 / risk R-05.
# =============================================================================

project_build: hg19

# -----------------------------------------------------------------------------
# Integrity policy — stated plainly because it is weaker than it looks.
# -----------------------------------------------------------------------------
integrity:
  # VERIFIED 2026-07-26: GEO filelist.txt publishes only Name/Time/Size/Type.
  # It publishes NO MD5 or SHA256. Checked for all series used here.
  published_checksums_available: false
  # Therefore integrity rests on two things:
  #   1. exact byte size, published by GEO and authoritative
  #   2. SHA256 computed on first successful download (trust-on-first-use),
  #      recorded in data/metadata/checksums.sha256 and enforced thereafter
  # TOFU proves a file has not changed or corrupted SINCE we fetched it. It does
  # NOT prove we fetched what the authors deposited. Do not overstate it.
  primary_check: size_bytes
  secondary_check: sha256_tofu
  gzip_integrity_check: true    # gzip -t on every .gz — catches truncation that
                                # a size match alone would miss on resume

# =============================================================================
# D1 · KEYSTONE — paralog-resolved binding + accessibility
# =============================================================================
datasets:

  - id: GSE230649
    accession: GSE230649
    role: keystone
    layer: cis_regulatory
    assay: [ChIP-seq, ATAC-seq]
    targets: [MYC, MYCN, MYCL1, H3K27ac, ATAC]
    n_samples: 28
    genome_build: hg19          # !Sample_data_processing = Assembly: hg19
    build_matches_project: true
    organism: Homo sapiens
    publication:
      pmid: 38747975
      doi: 10.1158/1541-7786.MCR-23-0599
      citation: >-
        Plotnik JP et al. (2024) MYC family amplification dictates sensitivity to
        BET bromodomain protein inhibitor Mivebresib (ABBV-075) in small cell lung
        cancer. Mol Cancer Res.
      note: >-
        Foundation of this project. Paralog-specific enhancer binding is THEIR
        finding and is cited, never re-claimed (decision D-001).
    source_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE230649
    acquisition:
      method: per_sample            # 28 individual GSM files, NOT the 8.6 GB tar
      rationale: >-
        The series tar is 9,223,034,880 bytes. Individual GSM supplementary files
        are separately addressable and the endpoint returns HTTP 206 to range
        requests (verified), so per-sample fetching is genuinely resumable and
        avoids needing ~17 GB of transient disk to untar. A failed download costs
        one file, not the whole set.
      file_pattern: '\.bedgraph\.gz$'
      expected_files: 28
    preprocessing_status: >-
      MACS2 treat_pileup signal tracks (bedGraph, gzipped). Aligned with BWA to
      hg19. NOT peak calls — the deposit contains no peak files, which is why the
      architecture quantifies signal over an ATAC-defined region universe (D-004).
    licence: >-
      NCBI GEO public data. No stated restriction; cite the original publication.
      Not redistributed by this repository.
    design_note: >-
      Composition verified from sample titles: H3K27ac x10 lines; MYC ChIP x5
      (H1048, H211, H524, H847, SHP77); MYCL1 ChIP x2 (COLO668, H889); MYCN ChIP
      x2 (H526, H69); ATAC x9. NOTE H211 has MYC ChIP but NO ATAC, and H196 has
      H3K27ac + ATAC but no MYC-family ChIP.

# =============================================================================
# D2 · SUPPORTING ACCESSIBILITY — all hg38, all require liftOver
# =============================================================================

  - id: GSE269424
    accession: GSE269424
    role: atac_support
    layer: cis_regulatory
    assay: [ATAC-seq]
    n_samples: 8
    genome_build: hg38          # Assembly: hg38
    build_matches_project: false
    liftover_required: true
    organism: Homo sapiens
    publication:
      pmid: null
      citation: "GEO series 'ATAC-seq of small cell lung cancer cell lines' (no linked PubMed ID as of 2026-07-26)."
    source_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE269424
    acquisition:
      method: per_sample
      file_pattern: '_EGFP_.*_peaks\.narrowPeak\.gz$'
      expected_files: 4
      rationale: >-
        Two restrictions, both deliberate.
        (1) narrowPeak calls, not bigWigs — ~2.7 MB versus ~250 MB, and only
        interval boundaries are needed for the consensus region universe. It also
        makes liftOver well defined: intervals lift, continuous signal does not.
        (2) EGFP control arms ONLY. See the caution below.
    preprocessing_status: MACS2 narrowPeak calls, hg38.
    licence: NCBI GEO public data. Cite the series.
    caution: >-
      RESOLVED 2026-07-26 — this series is NOT native SCLC accessibility. Sample
      titles are H524_ASCL1_1/2, H524_EGFP_1/2, Lu139_EGFP_1/2, Lu139_NEUROD1_1/2.
      The ASCL1 and NEUROD1 tokens are ECTOPICALLY EXPRESSED TRANSGENES, not ChIP
      antibodies (library strategy is ATAC-seq, no antibody characteristic). The
      series is a TF-overexpression chromatin-remodelling experiment.
      Consequence: the ASCL1/NEUROD1 arms have deliberately remodelled chromatin
      and MUST NOT enter a consensus universe intended to represent native SCLC
      accessibility. Only the four EGFP control arms are used. Line overlap with
      the keystone: H524 yes, Lu139 no.
      Had this been taken at face value from the frozen inventory's "ATAC-seq"
      label, engineered accessibility would have silently contaminated the region
      universe underpinning Aim 1.

