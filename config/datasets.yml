    preprocessing_status: MACS2 narrowPeak/broadPeak calls, hg19.
    licence: NCBI GEO public data. Cite the publication.

  - id: GSE249362
    accession: GSE249362
    role: lineage_tf_control
    layer: cis_regulatory
    assay: [ChIP-seq, RNA-seq]
    targets: [POU2F3, BRD9, H3K27ac, RPB1]
    n_samples: 125
    genome_build: hg19          # Assembly: hg19
    build_matches_project: true
    liftover_required: false
    organism: Homo sapiens
    publication:
      pmid: 39029464
      citation: >-
        Non-canonical BAF and mSWI/SNF regulates POU2F3 and are selective
        targetable dependencies for POU2F3-positive small cell lung cancer.
    source_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE249362
    acquisition:
      method: per_sample
      file_pattern: 'POU2F3.*\.bed\.gz$'
      expected_files: 5
      rationale: >-
        TRIAGE COMPLETE 2026-07-26 from filelist.txt (185 entries: 125 BW, 24 BED,
        36 TAB, 1 TAR). Taking the POU2F3 peak BED files only — 5 files totalling
        roughly 1.5 MB, versus ~20 GB if the 125 bigWigs were fetched. The BEDs are
        interval calls in hg19, so they need no liftOver and are directly usable.
        This is the single most efficient dataset in the project: the best
        lineage-TF control and the cheapest.
    preprocessing_status: >-
      POU2F3 ChIP peak calls (BED), hg19. Series also holds BRD9/H3K27ac/RPB1 ChIP
      and RNA-seq across DMSO / FHD286 / FHD609 treatment arms, none of which are
      downloaded.
    licence: NCBI GEO public data. Cite the publication.
    design_note: >-
      BEST cell-line overlap of any lineage-TF control. POU2F3 ChIP covers NCIH1048
      (= keystone H1048, MYC-amplified), NCIH211 (= H211, MYC-amplified) and NCIH526
      (= H526, MYCN-amplified) — three keystone lines spanning two paralogs, in the
      project's own build.
      Only the DMSO / untreated arms enter the confounding analysis. FHD286 and
      FHD609 are BRM/BRG1 inhibitor arms; note GSM8209575 (FHD286) has a 4,606-byte
      peak file versus 181,493 bytes for DMSO, i.e. the drug largely abolishes
      POU2F3 binding. Treated arms are retained for context, never as the reference
      lineage-TF repertoire.

# =============================================================================
# D4 · BULK TUMOUR EXPRESSION — the translation layer
# =============================================================================

  - id: GSE60052
    accession: GSE60052
    role: tumour_primary
    layer: transcriptional
    assay: [RNA-seq]
    n_samples: 86              # 79 SCLC + 7 normal
    genome_build: hg19         # gene-level; build not coordinate-critical
    build_matches_project: true
    organism: Homo sapiens
    publication:
      pmid: 27093186
      citation: RNA-seq of 79 small cell lung cancer and 7 normal control samples.
    source_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE60052
    acquisition:
      method: series_supplementary
      files: [GSE60052_79tumor.7normal.normalized.log2.data.Rda.tsv.gz]
    preprocessing_status: >-
      ALREADY NORMALISED, log2 scale, gene-symbol rows. VERIFIED by reading the
      file header. Raw counts are NOT deposited.
    licence: NCBI GEO public data. Cite the publication.
    caution: >-
      Because only log2-normalised values exist, DESeq2 CANNOT be used on this
      cohort — it requires raw integer counts. Differential analysis uses limma
      on the log2 matrix. The dependency inventory lists both, so this selects
      between them rather than changing the design. Also: column headers carry
      leading whitespace and normals are flagged by a '.normal' suffix, both of
      which are parsing traps handled explicitly at load.

  - id: cbioportal_sclc_ucologne_2015
    accession: sclc_ucologne_2015
    role: tumour_replication
    layer: transcriptional
    assay: [RNA-seq, WGS]
    genome_build: hg19
    organism: Homo sapiens
    publication:
      pmid: 26168399
      citation: George J et al. (2015) Comprehensive genomic profiles of small cell lung cancer. Nature.
    source_url: https://www.cbioportal.org/study/summary?id=sclc_ucologne_2015
    api_url: https://www.cbioportal.org/api/studies/sclc_ucologne_2015
    acquisition:
      method: rest_api
    preprocessing_status: Processed expression (continuous + z-score), mutations (MAF), structural variants.
    licence: cBioPortal public data. Cite George et al. 2015.
    caution: >-
      RE-VERIFIED 2026-07-26 via the molecular-profiles API. Available profiles are
      ONLY: MUTATION_EXTENDED, MRNA_EXPRESSION (CONTINUOUS), MRNA_EXPRESSION
      (Z-SCORE), STRUCTURAL_VARIANT. There is NO copy-number profile. MYC-paralog
      amplification status therefore cannot come from cBioPortal and must be taken
      from the paper's supplement. Never substitute expression for amplification —
      Plotnik's own data show MYC-amplified behaves differently from MYC-expressing.

