name: verify

# Checks that need no data and no package restore. The heavy work — restoring 232
# packages, downloading 12 GB, rebuilding figures — is deliberately NOT run here:
# it needs data that is not in version control, and a CI job that silently skips
# the real check is worse than no CI. What runs here is what can honestly run.
#
# The full gate is scripts/00_setup/07_clean_clone_verify.sh, run locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No absolute or home-relative paths in code
        run: |
          bad=$(grep -rnE '"(/home/|/Users/|/mnt/[a-z]/)|"~/' \
                  scripts/ R/ config/ report.qmd 2>/dev/null \
                  | grep -v '07_clean_clone_verify.sh' \
                  | grep -v '^\s*#' || true)
          if [ -n "$bad" ]; then echo "$bad"; echo "FAIL: non-portable paths"; exit 1; fi
          echo "OK: no absolute paths"

      - name: Referenced scripts exist
        run: |
          missing=0
          for s in $(grep -rhoE 'scripts/[0-9A-Za-z_/]+\.(R|sh)' README.md report.qmd scripts/ \
                       --exclude=01_init_git.sh --exclude=07_clean_clone_verify.sh | sort -u); do
            [ -f "$s" ] || { echo "MISSING: $s"; missing=1; }
          done
          [ $missing -eq 0 ] || { echo "FAIL: broken script references"; exit 1; }
          echo "OK: all referenced scripts present"

      - name: No data files committed
        run: |
          # The contract forbids data in version control. data/metadata is the
          # documented exception (manifests, checksums, small result tables).
          big=$(find . -path ./.git -prune -o -type f -size +5M -print | grep -v '^\./\.git' || true)
          if [ -n "$big" ]; then echo "$big"; echo "FAIL: files over 5 MB"; exit 1; fi
          raw=$(git ls-files data/raw data/processed 2>/dev/null || true)
          if [ -n "$raw" ]; then echo "$raw"; echo "FAIL: raw/processed data tracked"; exit 1; fi
          echo "OK: no large or raw data files tracked"

      - name: Shell scripts parse
        run: |
          rc=0
          for f in $(git ls-files '*.sh'); do bash -n "$f" || { echo "SYNTAX: $f"; rc=1; }; done
          exit $rc

      - name: R scripts parse
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq r-base-core
          Rscript -e '
            fs <- list.files(c("scripts","R"), "[.]R$", recursive=TRUE, full.names=TRUE)
            bad <- character()
            for (f in fs) tryCatch(parse(f), error=function(e) bad <<- c(bad, f))
            if (length(bad)) { cat("PARSE ERRORS:\n"); cat(paste(" ", bad), sep="\n"); quit(status=1) }
            cat("OK:", length(fs), "R scripts parse\n")'

      - name: Contract interpretive limits present
        run: |
          for f in report.qmd README.md figures/fig04_moes_null_caption.md; do
            grep -qi 'heuristic' "$f" && grep -qi 'not a predictive' "$f" \
              || { echo "FAIL: interpretive limit missing from $f"; exit 1; }
          done
          echo "OK: interpretive limits present"

      - name: Decision log has no unresolved placeholders
        run: |
          if grep -nE '^\s*(TODO|TBD|FIXME|XXX)' docs/decision_log.md; then
            echo "FAIL: placeholders in the decision log"; exit 1
          fi
          echo "OK: decision log clean ($(grep -c '^### D-0' docs/decision_log.md) entries)"
