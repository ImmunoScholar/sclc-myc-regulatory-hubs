# =============================================================================
# Analysis parameters.
#
# Thresholds live here, not scattered through the code. Changing a number here
# and re-running must be sufficient to change the analysis — if a threshold is
# hard-coded in a script, that is a bug.
#
# Every value carries a justification. "It is the default" is an acceptable
# justification only when the default is a genuine field convention.
# =============================================================================

project:
  name: sclc-myc-regulatory-hubs
  genome_build: hg19          # MANDATED by GSE230649 source alignment. Asserted
                              # at every coordinate-handling step. Do not change
                              # without a decision-log entry and a lift-over QC.
  seed: 20260726              # Set explicitly in every stochastic script.
  paralogs: [MYC, MYCN, MYCL1]

# -----------------------------------------------------------------------------
# Memory discipline. The machine has ~10 GB RAM (risk R-13); bedGraph signal
# MUST be processed chromosome by chromosome. These are not tuning knobs, they
# are the reason the pipeline fits in memory at all.
# -----------------------------------------------------------------------------
compute:
  chromosome_wise: true
  chromosomes: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10,
                chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19,
                chr20, chr21, chr22, chrX]
                              # chrY excluded: SCLC lines are of mixed sex and
                              # chrY is unreliable in cancer lines.
                              # chrM excluded: no regulatory interpretation here.
  drop_nonstandard_seqlevels: true   # random/alt/unplaced contigs
  max_workers: 4              # of 6 cores; leaves headroom so the machine stays usable

# -----------------------------------------------------------------------------
# Aim 1 — regulatory layer
# -----------------------------------------------------------------------------
regions:
  # Consensus accessible-region universe built from ATAC-seq, then used as the
  # quantification grid for ChIP bedGraph signal. Replaces de novo peak calling,
  # which is impossible here (deposit ships bedGraph only). See D-004.
  # RENAMED IN MEANING 2026-07-26 (D-023). Originally "independent ATAC datasets".
  # The external datasets cover four cell lines of which only H524 is a keystone
  # line, so support is now counted across the NINE KEYSTONE ATAC LINES — the same
  # cells as the ChIP. External peak sets are per-region annotation, not a filter.
  # Value 2 is forced by the design, not chosen: MYCN and MYCL have two ATAC lines
  # each, so requiring >=3 would delete every paralog-specific region for two of
  # three paralogs.
  min_lines_supporting: 2
  min_datasets_supporting: 2  # DEPRECATED alias, retained so older runs are
                              # reproducible. Not read by current scripts.
  min_width: 150              # below ~1 nucleosome is not an interpretable
                              # regulatory element
  max_width: 10000            # wider intervals are almost always merged
                              # artefacts; SEs are handled separately by stitching
  merge_gap: 100              # merge regions closer than this
  atac_threshold_multiple: 3  # x each line's mean signal over covered bases.
                              # Selected on intrinsic quality, not fitted (D-024).
  blacklist: encode_hg19_v2   # applied 2026-07-26; 5.11% of regions removed

active_regions:
  # A region is "active" for a paralog if it carries paralog signal AND H3K27ac.
  # Mirrors Plotnik's logic (binding ∩ H3K27ac).
  require_h3k27ac: true
  min_replicates: 2           # of the lines assayed for that paralog. Pre-registered
                              # at M1 and unchanged; the `ge2` rule in the gate.

  # DEAD PARAMETERS, removed 2026-07-26 in the parameter sweep:
  #   signal_quantile: 0.75         — thresholding is fold-over-background, not
  #                                   quantile-based. Its circularity is exactly
  #                                   what D-020 documents.
  #   sensitivity_quantiles: [...]  — superseded by fold_grid below.

  # Counts are reported ACROSS thresholds, never at one value (D-020). This grid
  # was HARDCODED in 15_paralog_regions.R and 16_m5_gate.R, which violates this
  # file's own rule that a threshold hard-coded in a script is a bug. Now here.
  fold_grid: [1.5, 2.0, 3.0, 4.0]
  primary_fold: 2.0

# -----------------------------------------------------------------------------
# M5 GATE — corrected 2026-07-26. See decision D-020.
#
# The original gate required our active-region counts to land near Plotnik's
# 18,823 / 4,017 / 5,688. That gate was CIRCULAR and could not fail:
#
#     count ≈ |ATAC universe| × P(signal > quantile) × P(H3K27ac+)
#
# signal_quantile 0.75 passes ~25% of regions BY CONSTRUCTION. With H3K27ac+
# covering ~60% of accessible regions, the count is ~15% of the universe, so any
# universe near 125,000 regions reproduces Plotnik's number regardless of whether
# the pipeline is correct. Matching it would have validated nothing.
#
# The gate is therefore rebuilt from RELATIVE, threshold-invariant properties —
# quantities we cannot move by tuning our own parameters.
# -----------------------------------------------------------------------------
m5_gate:
  # 1. Paralog region-set relationships. Both sets are thresholded identically,
  #    so their OVERLAP RATIO is a property of the data, not of the threshold.
  mycn_in_myc_fraction:
    published: 0.84           # Plotnik et al. 2024
    tolerance: 0.15           # pass if within +/- 0.15 across the sensitivity range
  # AMENDED 2026-07-26 — see D-025. The original test (raw MYCL1-in-MYC < 0.50)
  # was not fair under this design. Every paralog is quantified over ONE shared
  # ATAC-defined grid, so all paralogs are scored at the same 102,334 coordinates
  # and cross-paralog overlap is mechanically inflated. Plotnik called peaks
  # de novo per line with no shared grid, so their MYCL1 peaks could sit at
  # coordinates absent from the MYC peak sets entirely; ours cannot. Observed
  # 0.774 against a 0.50 threshold was measuring our design, not the biology.
  mycl1_vs_mycn_nesting:
    # Test the DIFFERENTIAL, which is what Plotnik actually reported: MYCN
    # substantially nested in MYC, MYCL1 "largely non-overlapping". Expressed as
    # enrichment over chance so set sizes and the shared grid cancel.
    #   enrichment(P) = [ |P ∩ MYC| / |P| ] / [ |MYC| / |universe| ]
    require_direction: true       # enrichment(MYCN) MUST exceed enrichment(MYCL1)
    test: fisher                  # on the 2x2 of in/out-of-MYC by paralog
    alpha: 0.05
    report_effect_size: true      # odds ratio + CI alongside p, per tables config
    # No absolute magnitude threshold: Plotnik gives no numeric value for MYCL1,
    # so inventing one would be fitting a target we do not have. Direction and
    # significance are falsifiable; magnitude is reported.
    #
    # FALSIFIABLE AS INTENDED: if MYCL1 is as nested in MYC as MYCN is, the
    # paralogs are not distinguishable by occupancy in these data, and that
    # negative result is the finding.

  # 2. Between-group contrast in distal fraction. Immune to universe size because
  #    it compares two groups processed identically.
  distal_fraction_contrast:
    myc_amplified_published: 0.39
    myc_expressing_published: 0.12
    require_direction: true   # amplified MUST exceed expressing; magnitude is secondary
    min_difference: 0.10

  # 3. Sequence-level validation — the check we cannot tune (D-021/D-022).
  #    Plotnik's paralog-specific E-box central dinucleotides.
  motif_validation:
    enabled: true
    ebox_canonical: CACGTG
    paralog_ebox:
      MYC:   CAGATG
      MYCN:  CACATG
      MYCL1: CACCTG
    flank_bp: 250             # window around region summit for motif scanning
    # ADOPTED TEST: compositional. All three motifs are counted in the SAME
    # sequences and compared as shares, so base composition cancels by
    # construction. Required: each paralog's own motif has the highest share in
    # its own regions (3/3), plus motif x region-set dependence at p < 0.05.
    test: compositional_share
    require_all_three: true
    dependence_alpha: 0.05
    # DEAD PARAMETERS, removed 2026-07-26:
    #   require_enrichment_over_shuffled / n_shuffles: 100
    # An absolute rate against an unmatched background was tried and was
    # CONFOUNDED — 8 of 9 enrichments fell below 1.0 because the paralog E-boxes
    # differ in GC (CAGATG/CACATG 50%, CACCTG 67%) while bound regions are
    # GC-rich. That comparison measured base composition, not motif preference.
    # It is retained in the gate output as diagnostic 4a and is NOT the verdict.

  # Counts ARE reported, prominently, but as description — never as pass/fail.
  report_counts_descriptively: true
  published_counts_for_reference:
    MYC: 18823
    MYCN: 4017
    MYCL1: 5688

# -----------------------------------------------------------------------------
# Regulon internal validity — must pass BEFORE any tumour scoring (D-021, E).
# A regulon that does not behave in the cells it was derived from cannot be
# meaningfully scored in tumours.
# -----------------------------------------------------------------------------
regulon_validity:
  # ------------------------------------------------------------------------
  # AMENDED 2026-07-26 (D-028). The original specification was NOT COMPUTABLE
  # and additionally circular.
  #
  #   require_source_line_separation / min_auc 0.70 — needs an amplified vs
  #     non-amplified split. MYC amplification is UNVERIFIED (D-026) and MYCN and
  #     MYCL1 have two lines each, so an AUC over 2 vs 8 is barely defined.
  #   require_expression_correlation / min_spearman 0.30 — needs expression for
  #     these cell lines. GSE230649 has no RNA-seq; CCLE arrives at M7.
  #
  # CIRCULARITY the original missed: a regulon built from a paralog's own lines
  # will score high in those lines by construction. That is not validation.
  # ------------------------------------------------------------------------
  method: leave_one_line_out   # build from the paralog's remaining line(s), test
                               # the HELD-OUT line against non-paralog lines.
                               # Non-circular, and computable with n=2 per paralog.
  min_holdout_rank_percentile: 0.75   # the held-out line must score in the top
                                      # quartile of all lines for its own regulon
  require_cross_paralog_distinctness: true
  max_regulon_jaccard: 0.60    # paralog regulons more similar than this are not
                               # separable and must be reported as such
  # ------------------------------------------------------------------------
  # AMENDED 2026-07-26 (D-029). HALLMARK_MYC_TARGETS_V1 alone was the wrong sole
  # benchmark. It is a pan-cancer, PROMOTER-centric, ribosome-and-translation set,
  # while Plotnik's published result for SCLC is that MYC ENHANCER targets map to
  # NEUROGENESIS. Our MYC regulon is neurogenesis-enriched at p = 2.7e-5 and shows
  # no Hallmark excess — exactly the published pattern. Gating on Hallmark alone
  # would have failed a regulon that reproduces the prior finding.
  #
  # NOT a relaxation: MYCL1 still fails this gate, and does so on the record.
  # ------------------------------------------------------------------------
  benchmark_mode: coherent_programme_per_paralog
  benchmark_sets:
    HALLMARK_MYC_TARGETS_V1: "promoter/housekeeping programme (MSigDB H)"
    GOBP_NEUROGENESIS_GROUP: "enhancer/neuronal programme (MSigDB C5 GO:BP)"
  benchmark_alpha: 0.05
  require_named_programme: true    # the passing programme must be NAMED per
                                   # paralog, never left implicit
  # Observed 2026-07-26 (primary, promoter-inclusive regulons):
  #   MYC   -> neurogenesis  OR 1.77, p 2.7e-05   PASS
  #   MYCN  -> Hallmark      OR 3.14, p 2.4e-04   PASS
  #   MYCL1 -> neither       best p 0.081         FAIL
  #
  # DISCORDANCE WITH PRIOR WORK, to be reported not buried: Plotnik grouped MYC
  # AND MYCN enhancer targets under neurogenesis. We reproduce it for MYC but not
  # for MYCN (neuro OR 1.03, p 0.44), which instead carries the strongest
  # housekeeping signal of the three.
  # DEFERRED TO M7, when DepMap supplies CCLE expression and copy number:
  deferred_to_m7:
    - amplified_vs_nonamplified_auc
    - expression_correlation

super_enhancers:
  # ROSE-style: stitch nearby H3K27ac regions, rank by total signal, cut at the
  # inflection point of the ranked curve. Genuine white space — Plotnik did a
  # 1 kb promoter/distal binary split only.
  stitch_distance: 12500      # ROSE convention (Whyte et al. 2013)
  exclude_tss_window: 2500    # ROSE convention: ignore promoter-proximal signal
                              # when stitching, so SEs are not just big promoters
  ranking_metric: total_signal
  # Added 2026-07-26 — both were hardcoded in the script.
  cutoff_method: knee_point   # maximum distance below the chord joining the
                              # curve endpoints. NOT first-slope>=1: that rule is
                              # numerically fragile and collapsed to the minimum
                              # for H1048, calling all 8,238 stitched regions SEs.
  max_fraction_called: 0.30   # >30% of stitched enhancers called is a broken
                              # inflection point, not a result. Hard failure.
  h3k27ac_fold: 2             # constituent must exceed this fold over background
  amplicon_flag_window_bp: 1000000   # confirmed amplicons only (D-026); MYC is
                                     # deliberately excluded as unverified

peak_to_gene:
  # Replaces "nearest gene", which is a known weak assignment.
  max_distance: 100000        # 100 kb — conventional enhancer search window
  correlation_method: spearman  # robust to the non-normality of signal data
  tss_source: TxDb.Hsapiens.UCSC.hg19.knownGene

  # --------------------------------------------------------------------------
  # AMENDED 2026-07-26 — see D-027. Two problems with the original spec.
  #
  # 1. It said "expression_correlated", but GSE230649 contains NO RNA-seq and our
  #    expression data are tumour cohorts, not these nine cell lines. CCLE
  #    expression arrives with DepMap at M7.
  # 2. min_abs_correlation was 0.3. At n = 10 lines that is p ~ 0.4 — a filter
  #    that looks rigorous while admitting noise. Significance at n = 10 needs
  #    |rho| >= 0.64. The 0.3 value was set at M1 when the single-cell layer was
  #    still in scope and more samples were expected; it was never revisited when
  #    that layer was dropped (D-005).
  # --------------------------------------------------------------------------
  method: distance_weighted_activity_correlated
  activity_proxy: promoter_h3k27ac
  activity_proxy_note: >-
    Promoter H3K27ac stands in for expression. This is an ABC-family activity
    model, NOT expression correlation, and must be described that way in every
    output. Upgrade to CCLE expression at M7.
  n_samples: 10               # the hard constraint behind the tiers below

  # Confidence tiers instead of one pass/fail, because n = 10 cannot support a
  # single credible cutoff.
  correlation_tiers:
    high:     0.64            # p < 0.05 at n = 10
    moderate: 0.45            # suggestive; reported, never treated as established
    weak:     0.30            # retained only with distance support; flagged
  require_null_validation: true   # candidate pairs must out-correlate a null of
                                  # random pairs >1 Mb apart
  distance_decay_kb: 25       # exponential distance weight, ABC-style

regulons:
  min_size: 10                # smaller regulons give unstable enrichment scores
  max_size: 500               # larger ones are too diffuse to be a "hub"
  # CLARIFIED 2026-07-26. max_size is not a truncation of an arbitrary list: MYC
  # links to thousands of genes, and singscore/GSVA need focused sets. A paralog
  # regulon is therefore the TOP-RANKED linked genes by aggregate link score, not
  # every gene with a link. The selection rule is part of the definition and must
  # be stated in the methods, not applied silently.
  selection: top_by_aggregate_link_score
  link_tiers_used: [high, moderate]   # weak-tier links excluded from regulons

# -----------------------------------------------------------------------------
# Aim 2 — patient-tumour translation
# -----------------------------------------------------------------------------
tumour_scoring:
  method: singscore           # rank-based, single-sample, no dependence on
                              # cohort composition — important when comparing
                              # across two cohorts of different design
  secondary_method: gsva      # sensitivity check only; agreement is reported
  min_expressed_fraction: 0.2 # drop genes expressed in <20% of samples

lineage_confounding:
  # PRIMARY analysis, not a robustness check (risk R-01). MYC-amp correlates
  # with subtype, so paralog-specific hubs may be lineage-TF targets in disguise.
  #
  # CORRECTED 2026-07-26. The original list included YAP1, for which NO ChIP-seq
  # exists in any acquired dataset. Occupancy-level confounding can only be tested
  # for the three TFs with binding data; YAP1 is usable solely as an
  # expression-based subtype marker in the tumour cohorts.
  lineage_tfs_with_chip: [ASCL1, NEUROD1, POU2F3]
  lineage_tfs_expression_only: [YAP1]
  # Resolution differs per TF and must be reported per TF, never uniformly (R-14):
  #   POU2F3  — within-line in 3 keystone lines (H1048, H211, H526), hg19. Strongest.
  #   ASCL1   — within-line in SHP-77 only, n=1, hg38. Descriptive; no inference.
  #   NEUROD1 — H446 only, ZERO keystone overlap. Subtype-level comparison only.
  report_overlap_fraction: true
  partial_correlation: true   # paralog association adjusted for lineage-TF score
  report_resolution_per_tf: true   # a blanket "we controlled for lineage TFs"
                                   # would be false and is forbidden

# -----------------------------------------------------------------------------
# Aim 3 — functional and network evidence
# -----------------------------------------------------------------------------
depmap:
  release: null               # MUST be pinned before use. DepMap re-releases
                              # quarterly and gene-effect values change between
                              # releases (risk R-08). null here is a deliberate
                              # tripwire: scripts fail rather than run unpinned.
  selective_dependency_threshold: -0.5   # Chronos gene effect; -1 ~ median
                                         # essential, 0 ~ non-essential
  lineage_filter: small_cell_lung_carcinoma
  # EXPANDED 2026-07-26. The manual download must now include CCLE EXPRESSION —
  # it is required to upgrade peak-to-gene from the H3K27ac activity proxy
  # (D-027) and to run the deferred regulon-validity checks (D-028). It was not
  # in the original required-files list because those needs arose later.
  required_files:
    - CRISPRGeneEffect.csv                            # selective dependency
    - Model.csv                                       # line metadata, lineage
    - OmicsCNGene.csv                                 # copy number -> unblocks gate criterion 3
    - OmicsExpressionProteinCodingGenesTPMLogp1.csv   # expression -> D-027, D-028
  unblocks:
    - m5_gate_criterion_3_distal_contrast
    - peak_to_gene_expression_correlation
    - regulon_validity_amplification_auc

genie3:
  regulators: [MYC, MYCN, MYCL1]
  n_trees: 1000               # GENIE3 default; stable importance estimates
  tree_method: RF

# -----------------------------------------------------------------------------
# Aim 4 — MOES evidence integration
# -----------------------------------------------------------------------------
moes:
  method: robust_rank_aggregation
  stages: 2                   # RRA within domain, then RRA across domains
  domains: [cis_regulatory, transcriptional, network, functional]
  # NO WEIGHTS. Layers are non-independent (chromatin evidence is correlated by
  # construction), so a weighted sum would multiply-count it. See D-003.
  permutations: 10000         # empirical FDR
  fdr_threshold: 0.05
  leave_one_domain_out: true  # stability check — a hub that depends on a single
                              # domain is not multi-evidence supported
  report_layer_correlation: true

  # Rank uncertainty (D-021, C). A prioritisation offered as a contribution must
  # say how precise it is. A point rank implies a confidence the data may not
  # support: "hub #3" and "hub #17" can be indistinguishable under resampling.
  bootstrap:
    enabled: true
    n_resamples: 2000
    ci: 0.95
    report_rank_interval: true    # every hub carries a rank CI, not just a rank
    # A hub whose rank interval spans more than this fraction of the list is
    # reported as UNSTABLE regardless of its point rank.
    max_relative_interval_width: 0.25

controls:
  # PRE-REGISTERED. Declared before any result exists so they cannot be tuned
  # after the fact. Hard gate at M8.
  negative_control_genes: [RPS26]   # Plotnik's paralog-SHARED housekeeping
                                    # promoters. Must NOT rank as
                                    # paralog-specific hubs. Failure = the
                                    # framework lacks specificity, and is
                                    # reported as failed.
  positive_control_axis: [BCL2, MCL1]  # Dammert et al. 2019 apoptotic priming
  # SPLIT 2026-07-26. The Hallmark sets come from msigdbr. The Jung 2017 18-gene
  # MYC-activity signature is NOT in MSigDB under any name and must be curated by
  # hand from the paper before it can be used. Listing it alongside two
  # automatically retrievable sets implied an availability it does not have.
  benchmark_signatures_available: [HALLMARK_MYC_TARGETS_V1, HALLMARK_MYC_TARGETS_V2]
  benchmark_signatures_manual:
    JUNG2017_MYC_ACTIVITY:
      status: NOT_YET_CURATED
      source: "Jung et al. 2017, Cancer Res — 18-gene pan-cancer MYC activity signature"
      note: >-
        Must be transcribed from the publication and stored in
        data/metadata/signatures/. The comparison it enables is the point of
        including it — a paralog-blind, pan-cancer signature is the status quo our
        paralog-resolved regulons are meant to improve on. Do not silently drop it.

# -----------------------------------------------------------------------------
# Aim 5 — spatial (restricted)
# -----------------------------------------------------------------------------
spatial:
  enabled: true
  panel_size_approx: 1800
  report_coverage_fraction: true   # on EVERY spatial figure — most regulon
                                   # members are not on the panel
  # RAISED 2026-07-26. Was 5 — far too permissive. Regulons are capped at 500
  # genes and the CTA panel measures ~1,738-1,766 targets, so a regulon may have
  # only a handful of members on the panel. Scoring a 500-gene regulon from 5
  # measured genes is not a measurement of that regulon. Both an absolute floor
  # and a coverage fraction now apply, and the fraction is the binding one.
  min_genes_measured: 20
  min_coverage_fraction: 0.10      # >=10% of regulon members must be on the panel
  report_coverage_per_regulon: true

  # ---------------------------------------------------------------------------
  # KNOWN DEPOSIT GAP — characterised 2026-07-26, see risk R-17.
  # GSE261348 annotates 184 segments in SegmentProperties but deposits only 175
  # columns in TargetCountMatrix. The 9 missing segments were characterised
  # rather than waved through, and the pattern is INVERTED from a QC exclusion:
  # they carry ~4x the median read depth (28.9M vs 7.7M raw), normal saturation,
  # normal nuclei counts and NO QC flags. The one segment from that slide that
  # WAS deposited has 695K reads (40x fewer than its slide-mates), a
  # "Low Negative Probe Count" flag and 241 nuclei.
  # Best explanation is a deposition error upstream, not a filtering decision.
  # Declared here so QC verifies the discrepancy still matches what we
  # characterised — a DIFFERENT discrepancy on re-download must fail.
  # ---------------------------------------------------------------------------
  known_segment_gaps:
    GSE261348:
      annotated_segments: 184
      deposited_rois: 175
      missing_count: 9
      missing_slide: "IMF-001/002"
      missing_rois: ["002","003","004","005","006","007","008","009","010"]
      characterisation: >-
        Not a QC exclusion. Missing segments have higher read depth than those
        retained and carry no QC flags. Treated as an upstream deposit gap.
      m9_action: >-
        EXCLUDE slide IMF-001/002 entirely from spatial scoring. Its only
        deposited segment (ROI 001) is 40x under-sequenced relative to its
        slide-mates and QC-flagged, so retaining it would contribute one
        unreliable ROI while the nine usable ones are unavailable.
  # Prognostic, survival and immune-exclusion analyses are OUT OF SCOPE (D-001,
  # Zhang et al. 2025). Enforced by review at M9, not by a parameter.

# -----------------------------------------------------------------------------
# Figures
# -----------------------------------------------------------------------------
figures:
  dpi: 300
  device: ragg_png
  width_single: 90            # mm, single-column
  width_double: 180           # mm, double-column
  base_font_size: 8
  palette_paralog:
    MYC:   "#B2182B"
    MYCN:  "#2166AC"
    MYCL1: "#1B7837"
  palette_sequential: viridis

  # ---------------------------------------------------------------------------
  # Publication output standards (D-021, D). Each of these is CHECKED, not
  # asserted — an unverified claim of accessibility is worth nothing.
  # ---------------------------------------------------------------------------
  vector_output: true         # every figure emitted as PDF as well as PNG;
                              # raster-only figures cannot be rescaled for print
  embed_fonts: true
  min_text_pt: 6              # smallest permitted text AT FINAL PRINT SIZE.
                              # Automatically checked; a figure that violates it
                              # fails rather than being shipped illegible.
  colourblind_safe: true
  colourblind_check:
    enabled: true
    simulate: [deutan, protan, tritan]   # via colorspace
    min_perceptual_distance: 15          # CIE dE between any two series colours
                                         # under every simulation; below this the
                                         # palette is rejected
  figure_manifest: true       # every figure recorded with its generating script,
                              # inputs and caption, so no figure is untraceable

tables:
  # Numbers are formatted deliberately. Precision that exceeds what the data
  # support is a form of overclaiming.
  significant_digits: 3
  p_value_format: scientific
  p_value_floor: 1e-16        # report "< 1e-16" rather than an implausible exact value
  always_report_effect_size: true   # effect size + CI accompany every p-value
  require_n_in_caption: true
  export_formats: [csv, gt_html]    # machine-readable AND publication-rendered
  footnote_required_for:
    - any column whose interpretation is not obvious from its name
    - any filtered or excluded subset
    - any value derived under an assumption
