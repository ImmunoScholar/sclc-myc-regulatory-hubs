# =============================================================================
# D3 · LINEAGE-TF ChIP — confounder controls for the PRIMARY analysis (R-01)
# =============================================================================

  - id: GSE281524
    accession: GSE281524
    role: lineage_tf_control
    layer: cis_regulatory
    assay: [ChIP-seq]
    targets: [ASCL1]
    n_samples: 10
    genome_build: hg38          # Assembly: Human GRCh38
    build_matches_project: false
    liftover_required: true
    organism: Homo sapiens
    publication:
      pmid: 40419484
      citation: ASCL1-ChIP sequence data of small cell lung cancer cell lines.
    source_url: https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE281524
    acquisition:
      method: per_sample
      # NOTE the hyphen: sample TITLES say "SHP77" but FILE NAMES say "SHP-77".
      # A 'SHP77' pattern silently matches nothing and would have dropped the only
      # keystone-overlapping ASCL1 samples in the project without erroring. This
      # is why expected_files is asserted — a zero match must be a hard failure,
      # never an empty success.
      file_pattern: 'SHP-?77.*\.bw$'
      expected_files: 5
      rationale: >-
        SHP77 samples only (ASCL1 rep1/rep2, IgG rep1/rep2, input) — 5 files of
        ~600 MB rather than all 10 (~6 GB). Verified sample composition: H1836
        (ASCL1 x2, IgG x2, input) and SHP77 (ASCL1 x2, IgG x2, input). SHP77 is a
        keystone MYC-ChIP line; H1836 is not in the keystone set at all, so its
        ASCL1 tracks cannot contribute to a within-line confounding comparison.
        Downloading 3 GB of unusable-for-this-purpose data would be waste.
    preprocessing_status: 10M-normalised bigWig, hg38. IgG and input controls included.
    licence: NCBI GEO public data. Cite the publication.
    caution: >-
      Two issues, both verified 2026-07-26.
      (1) BUILD SPLIT: the three lineage-TF controls do NOT share a genome build —
      ASCL1 is hg38, NEUROD1 and POU2F3 are hg19. Lineage-TF confounding is a
      PRIMARY analysis (R-01), so an undetected mismatch here would corrupt the
      project's central claim. Build is asserted per file.
      (2) SIGNAL ONLY: this series deposits bigWigs and no peak calls. Since signal
      cannot be lifted across builds meaningfully, intervals are called in the
      NATIVE hg38 space first and only the resulting intervals are lifted to hg19
      (policy D-014).

  - id: GSE210113
    accession: GSE210113
    role: lineage_tf_control
    layer: cis_regulatory
    assay: [ChIP-seq]
    targets: [NEUROD1, H3K27ac]
    n_samples: 14
