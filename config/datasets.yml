# D6 · REFERENCE RESOURCES
# =============================================================================

  - id: ucsc_chain_hg38_to_hg19
    accession: hg38ToHg19.over.chain.gz
    role: reference
    layer: infrastructure
    genome_build: hg38->hg19
    source_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/liftOver/hg38ToHg19.over.chain.gz
    mirror_url: https://hgdownload2.soe.ucsc.edu/goldenPath/hg38/liftOver/hg38ToHg19.over.chain.gz
    expected_size_bytes: 1246411    # verified 2026-07-26
    acquisition:
      method: direct
    preprocessing_status: UCSC liftOver chain.
    licence: >-
      UCSC Genome Browser data. Free for academic, non-profit and personal use;
      see https://genome.ucsc.edu/license/ . Not redistributed by this repository.
    criticality: >-
      LOAD-BEARING. Four of seven coordinate datasets are hg38 and cannot enter the
      analysis without this. Lift loss rate is QC'd and reported (D-014).

  - id: ucsc_hg19_chrom_sizes
    accession: hg19.chrom.sizes
    role: reference
    layer: infrastructure
    genome_build: hg19
    source_url: https://hgdownload.soe.ucsc.edu/goldenPath/hg19/bigZips/hg19.chrom.sizes
    expected_size_bytes: 1971
    acquisition:
      method: direct
    preprocessing_status: Plain text chromosome sizes.
    licence: UCSC Genome Browser data; see https://genome.ucsc.edu/license/ .
    purpose: >-
      Ground truth for build assertions. Any interval exceeding its chromosome
      length is proof of a build mismatch and halts the pipeline.

  - id: depmap
    accession: PENDING_PIN          # config/params.yml depmap.release must be set
    role: functional
    layer: functional
    source_url: https://depmap.org/portal/data_page/
    acquisition:
      method: MANUAL                # cannot be automated — see below
      manual_reason: >-
        VERIFIED 2026-07-26: depmap.org serves a Cloudflare Turnstile bot check and
        the page explicitly asks users not to scrape the portal. Automated fetching
        is therefore both technically blocked and against the site's stated wishes,
        so it is not attempted. The Bioconductor `depmap` package is not an
        alternative either — it routes through ExperimentHub to bioconductor.org,
        which is unroutable from this network (D-006).
      required_files:
        - CRISPRGeneEffect.csv        # Chronos gene effect
        - Model.csv                   # cell line metadata incl. lineage
        - OmicsCNGene.csv             # copy number, for paralog amplification
      destination: data/raw/depmap/
    preprocessing_status: Processed Chronos gene-effect scores.
    licence: >-
      DepMap data released under CC BY 4.0. Attribution and release citation
      required. Not redistributed by this repository.
    caution: >-
      Release MUST be pinned. Gene-effect values change between quarterly releases
      (risk R-08). config/params.yml sets depmap.release to null as a deliberate
      tripwire so scripts fail rather than run against an unpinned release.
